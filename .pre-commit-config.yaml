repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint and safe fixes
        entry: python -m ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: python -m ruff format
        language: system
        types: [python]
      - id: mypy
        name: Mypy source type check
        entry: python -m mypy src/nifty_options
        language: system
        pass_filenames: false
        types: [python]
