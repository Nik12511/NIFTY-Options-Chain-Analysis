[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty-options-analytics"
version = "0.1.0"
description = "Daily BankNifty market data pipeline and options analytics dashboard"
requires-python = ">=3.14,<3.15"
dependencies = [
    "duckdb==1.5.6",
    "pandas==3.0.6",
    "python-dotenv==1.2.4",
    "streamlit==1.65.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
quality = ["mypy==2.4.0", "pre-commit==4.6.2", "ruff==0.17.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
files = ["src/nifty_options"]
warn_unused_configs = true
warn_return_any = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

